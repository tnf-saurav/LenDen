<!DOCTYPE html>
<html>
<head>
    <title>Add Vendor</title>
</head>
<body>
    <h2>Add Vendor</h2>
    <form method="post" action="">
        {% csrf_token %}
        {{ form.as_p }}
        {% for field in form %}
            {% for error in field.errors %}
                <div style="color: red;">
                    {{ error }}
                </div>
            {% endfor %}
        {% endfor %}
        <button type="submit">Add Vendor</button>
    </form>
    <a href="{% url 'vendors_list' %}">Back to Vendor List</a>
</body>
</html>
