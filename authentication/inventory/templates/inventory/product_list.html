<!DOCTYPE html>
<html>
<head>
    <title>Product List</title>
    <style>
        .product {
            border: 1px solid #ddd;
            padding: 10px;
            margin: 10px;
        }
        .product-name {
            font-weight: bold;
        }
        .product-description {
            margin-top: 5px;
        }
        .product-price, .product-quantity {
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h1>Product List</h1>
    <div id="products">
        {% for product in products %}
        <div class="product">
            <div class="product-name">{{ product.product.product_name }}</div>
            <div class="product-description">{{ product.product.description }}</div>
            <div class="product-price">Selling Price: {{ product.selling_price }}</div>
            <div class="product-quantity">Remaining Quantity: {{ product.remaining_quantity }}</div>
        </div>
        {% empty %}
        <p>No products available.</p>
        {% endfor %}
    </div>
</body>
</html>
