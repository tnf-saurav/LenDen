{% comment %} <div id="addProductModal" class="modal">
    <div class="modal-content add-vendor-form">
        <div class="form-header">
            <h2>Add Product</h2>
            <span class="close-btn" onclick="document.getElementById('addProductModal').style.display='none'">×</span>
        </div>
        <form method="POST" action="{% url 'add_product' vendor.id %}">
            {% csrf_token %}
            <div class="form-group form-group-row">
                <div class="form-group-item">
                    <label for="id_product_name">Product Name:</label>
                    <input type="text" name="product_name" id="id_product_name" required>
                </div>
                <div class="form-group-item">
                    <label for="id_date_of_order">Date of Order:</label>
                    <input type="date" name="date_of_order" id="id_date_of_order" required>
                </div>
            </div>
            <div class="form-group">
                <label for="id_description">Description:</label>
                <input type="text" name="description" id="id_description">
            </div>
            <div class="form-group form-group-row">
                <div class="form-group-item">
                    <label for="id_quantity_supplied">Quantity Supplied:</label>
                    <input type="number" min="0" name="quantity_supplied" id="id_quantity_supplied" value="0" required onkeypress="return (event.charCode != 8 && event.charCode >= 48 && event.charCode <= 57)">
                </div>
                <div class="form-group-item">
                    <label for="id_unit_price">Unit Price:</label>
                    <input type="number" step="0.01" min="0" name="unit_price" id="id_unit_price" required>
                </div>
            </div>
            <div class="form-group">
                <label for="id_total_price">Total Price:</label>
                <input type="number" step="0.01" name="total_price" id="id_total_price" style="display: none;">
                <span id="total_price_display" class="calculated-value">0.00</span>
            </div>
            <div class="form-group form-group-row">
                <div class="form-group-item">
                    <label for="id_selling_price">Selling Price:</label>
                    <input type="number" step="0.01" min="0" name="selling_price" id="id_selling_price" required>
                </div>
                <div class="form-group-item">
                    <label for="id_paid_amount">Paid Amount:</label>
                    <input type="number" step="0.01" min="0" name="paid_amount" id="id_paid_amount">
                </div>
            </div>
            <div class="form-group">
                <label for="id_due_amount">Due Amount:</label>
                <input type="number" step="0.01" name="due_amount" id="id_due_amount" style="display: none;">
                <span id="due_amount_display" class="calculated-value">0.00</span>
            </div>
            <button type="submit" class="submit-btn">Add Product</button>
        </form>
    </div>
</div> {% endcomment %}
