<!DOCTYPE html>
<html>
<head>
    <title>Vendors List</title>
</head>
<body>
    <h2>Vendors List</h2>
    <form method="get" action="">
        <input type="text" name="search" placeholder="Search vendors...">
        <button type="submit">Search</button>
    </form>
    <a href="{% url 'add_vendor' %}">Add Vendor</a>
    <ul>
        {% for vendor in vendors %}
            <li>
                <a href="{% url 'vendor_detail' vendor.id %}">{{ vendor.vendor_name }}</a>
                - {{ vendor.address }}
                - <span style="color: {% if vendor.is_due %}red{% else %}green{% endif %};">Due: {{ vendor.due_amount }}</span>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
