<!-- authentication/inventory/templates/inventory/product_list.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inventory List</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/inventory.css' %}">
</head>
<body>
    <h1>Inventory List</h1>
    {% if products %}
        {% for product in products %}
            <div class="inventory-item">
                <h3>{{ product.product.product_name }}</h3>
                <p><strong>Remaining Quantity:</strong> {{ product.remaining_quantity }}</p>
                <p><strong>Selling Price:</strong> ${{ product.selling_price }}</p>
            </div>
        {% endfor %}
    {% else %}
        <p>No products in inventory yet.</p>
    {% endif %}
</body>
</html>
