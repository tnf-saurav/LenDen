<!DOCTYPE html>
<html>
<head>
    <title>Product List</title>
</head>
<body>
    <h1>Product List</h1>
    <table>
        <tr>
            <th>Name</th>
            <th>Description</th>
            <th>Selling Price</th>
            <th>Remaining Quantity</th>
        </tr>
        {% for product in products %}
        <tr>
            <td><a href="{% url 'product_detail' product.pk %}">{{ product.product.name }}</a></td>
            <td>{{ product.product.description }}</td>
            <td>{{ product.selling_price }}</td>
            <td>{{ product.remaining_quantity }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
