{% comment %} {% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Edit Product</title>
    <link rel="stylesheet" href="{% static 'css/vendors.css' %}">
</head>
<body>
    <h2>Edit Product</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save Changes</button>
    </form>
    <a href="{% url 'vendors_detail' product.vendor.id %}">Back to Vendor Details</a>
    <script src="{% static 'js/vendors.js' %}"></script>
    <!-- Cloudflare script unchanged -->
    <script>(function(){...})();</script>
</body>
</html> {% endcomment %}

<div id="editProductModal" class="modal">
    <div class="modal-content add-vendor-form">
        <div class="form-header">
            <h2>Edit Product</h2>
            <span class="close-btn" onclick="document.getElementById('editProductModal').style.display='none'">×</span>
        </div>
        <form method="POST" action="" id="editProductForm">
            {% csrf_token %}
            <input type="hidden" name="product_id" id="edit_product_id">
            <div class="form-group form-group-row">
                <div class="form-group-item">
                    <label for="edit_product_name">Product Name:</label>
                    <input type="text" name="product_name" id="edit_product_name" required>
                </div>
                <div class="form-group-item">
                    <label for="edit_date_of_order">Date of Order:</label>
                    <input type="date" name="date_of_order" id="edit_date_of_order" required>
                </div>
            </div>
            <div class="form-group">
                <label for="edit_description">Description:</label>
                <input type="text" name="description" id="edit_description">
            </div>
            <div class="form-group form-group-row">
                <div class="form-group-item">
                    <label for="edit_quantity_supplied">Quantity Supplied:</label>
                    <input type="number" min="0" name="quantity_supplied" id="edit_quantity_supplied" value="0" required onkeypress="return (event.charCode != 8 && event.charCode >= 48 && event.charCode <= 57)">
                </div>
                <div class="form-group-item">
                    <label for="edit_unit_price">Unit Price:</label>
                    <input type="number" step="0.01" min="0" name="unit_price" id="edit_unit_price" required>
                </div>
            </div>
            <div class="form-group">
                <label for="edit_total_price">Total Price:</label>
                <input type="number" step="0.01" name="total_price" id="edit_total_price" style="display: none;">
                <span id="edit_total_price_display" class="calculated-value">0.00</span>
            </div>
            <div class="form-group form-group-row">
                <div class="form-group-item">
                    <label for="edit_selling_price">Selling Price:</label>
                    <input type="number" step="0.01" min="0" name="selling_price" id="edit_selling_price" required>
                </div>
                <div class="form-group-item">
                    <label for="edit_paid_amount">Paid Amount:</label>
                    <input type="number" step="0.01" min="0" name="paid_amount" id="edit_paid_amount">
                </div>
            </div>
            <div class="form-group">
                <label for="edit_due_amount">Due Amount:</label>
                <input type="number" step="0.01" name="due_amount" id="edit_due_amount" style="display: none;">
                <span id="edit_due_amount_display" class="calculated-value">0.00</span>
            </div>
            <button type="submit" class="submit-btn">Update Product</button>
        </form>
    </div>
</div>
